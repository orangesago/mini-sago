name: Container image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        include:
          - name: core
            dockerfile: Dockerfile
            image: ghcr.io/sago-cream/minisago
          - name: worker
            dockerfile: Dockerfile.worker
            image: ghcr.io/sago-cream/minisago-worker
          - name: ccxp
            dockerfile: Dockerfile.ccxp
            image: ghcr.io/sago-cream/minisago-ccxp
    steps:
      - uses: actions/checkout@v7
      - name: Resolve stable Codex version
        if: matrix.name == 'worker'
        id: codex
        run: |
          version="$(bash scripts/resolve-codex-version.sh)"
          echo "build_args=CODEX_VERSION=$version" >> "$GITHUB_OUTPUT"
          echo "Building Oracle worker with Codex $version"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: metadata
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=main
            type=sha,prefix=sha-,format=long
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ steps.codex.outputs.build_args }}
          platforms: linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
